# Build, test and package the openmvg-fast branch on Linux (GCC), Windows
# (clang) and macOS (AppleClang, arm64).
# Pushing a tag v* additionally publishes the packages as a GitHub release.
#
# Only the bundled dependencies are used (src/third_party, src/dependencies
# and Google Highway fetched by LeanSIFT), so the binaries do not depend on
# system libraries other than the C/C++ runtime. The OpenMP runtime (LLVM's
# libomp) is bundled with the Windows and macOS packages; on macOS it is
# Homebrew's. No GUI (Qt5), OpenGL or OpenCV programs are built.
#
# The packages are full installations, usable by other CMake projects with
# find_package(OpenMVG). No link time optimization: it would turn the static
# libraries into compiler specific bitcode.

name: openmvg-fast

on:
  push:
    branches: [openmvg-fast]
    tags: ['v*']
  pull_request:
    branches: [openmvg-fast]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: 22.1.2
  CTEST_OUTPUT_ON_FAILURE: 1
  # Common configuration: release build of the command line programs and
  # unit tests, portable x86-64 code (LeanSIFT, the matchers and Highway
  # select SIMD code paths at run time), and no system libraries for the
  # dependencies that are bundled.
  # CMAKE_POLICY_VERSION_MINIMUM: several bundled libraries declare
  # cmake_minimum_required versions below 3.5, which CMake 4 rejects.
  CMAKE_COMMON_ARGS: >-
    -G Ninja
    -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    -DCMAKE_BUILD_TYPE=Release
    -DOpenMVG_BUILD_TESTS=ON
    -DOpenMVG_BUILD_EXAMPLES=OFF
    -DOpenMVG_BUILD_DOC=OFF
    -DOpenMVG_BUILD_SOFTWARES=ON
    -DOpenMVG_BUILD_GUI_SOFTWARES=OFF
    -DOpenMVG_BUILD_OPENGL_EXAMPLES=OFF
    -DOpenMVG_USE_OPENCV=OFF
    -DOpenMVG_USE_OCVSIFT=OFF
    -DOpenMVG_USE_OPENMP=ON
    -DTARGET_ARCHITECTURE=none
    -DSCHUR_SPECIALIZATIONS=ON
    -DLAPACK=OFF
    -DSUITESPARSE=OFF
    -DCXSPARSE=OFF
    -DCMAKE_DISABLE_FIND_PACKAGE_JPEG=ON
    -DCMAKE_DISABLE_FIND_PACKAGE_PNG=ON
    -DCMAKE_DISABLE_FIND_PACKAGE_TIFF=ON
    -DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON
    -DCMAKE_DISABLE_FIND_PACKAGE_Ceres=ON
    -DCMAKE_DISABLE_FIND_PACKAGE_cereal=ON
    -DCMAKE_DISABLE_FIND_PACKAGE_CoinUtils=ON
    -DCMAKE_DISABLE_FIND_PACKAGE_Clp=ON
    -DCMAKE_DISABLE_FIND_PACKAGE_Osi=ON

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35) so that the binaries run on older
          # distributions too.
          - name: linux-x64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-2025
          - name: macos-arm64
            os: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Package name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA::7}"
          fi
          echo "PKG_NAME=openMVG-fast-${version}-${{ matrix.name }}" >> "$GITHUB_ENV"

      # --- Linux: GCC ---------------------------------------------------------

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "STAGE_DIR=$RUNNER_TEMP/install" >> "$GITHUB_ENV"
          cmake -S src -B build $CMAKE_COMMON_ARGS \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/install" \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      # --- Windows: clang (GNU driver, MSVC ABI) -------------------------------

      - name: Cache LLVM (Windows)
        if: runner.os == 'Windows'
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc

      - name: Download LLVM (Windows)
        if: runner.os == 'Windows' && steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          archive="clang+llvm-${LLVM_VERSION}-x86_64-pc-windows-msvc.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/$archive"
          7z x "$RUNNER_TEMP/$archive" -so | 7z x -si -ttar -o'C:\llvm' > /dev/null
          rm "$RUNNER_TEMP/$archive"

      # The MSVC environment provides the Windows SDK, the MSVC runtime
      # libraries and Ninja. It also puts Visual Studio's own clang on the
      # path, so LLVM is referred to by absolute paths below. Likewise its
      # library path contains Visual Studio's libomp.lib (for
      # libomp140.x86_64.dll), so LLVM's libomp.lib is given explicitly.
      - name: Set up the MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          llvm="C:/llvm/clang+llvm-${LLVM_VERSION}-x86_64-pc-windows-msvc"
          stage="$(cygpath -m "$RUNNER_TEMP")/install"
          echo "LLVM_DIR=$llvm" >> "$GITHUB_ENV"
          echo "STAGE_DIR=$stage" >> "$GITHUB_ENV"
          cmake -S src -B build $CMAKE_COMMON_ARGS \
            -DCMAKE_INSTALL_PREFIX="$stage" \
            -DCMAKE_C_COMPILER="$llvm/bin/clang.exe" \
            -DCMAKE_CXX_COMPILER="$llvm/bin/clang++.exe" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DOpenMP_libomp_LIBRARY="$llvm/lib/libomp.lib"

      # --- macOS: AppleClang ------------------------------------------------------

      # AppleClang has no OpenMP runtime of its own; Homebrew's libomp is used
      # and bundled with the package. The build uses a copy whose install
      # name is @rpath/libomp.dylib, so that the programs find the bundled
      # copy (through their rpath @loader_path/../lib) and not Homebrew's.
      # OpenMP_ROOT lets find_package(OpenMP) find the copy.
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja libomp
          brew_omp="$(brew --prefix libomp)"
          omp="$RUNNER_TEMP/libomp"
          mkdir -p "$omp/lib"
          cp -RL "$brew_omp/include" "$omp/"
          cp -L "$brew_omp/lib/libomp.dylib" "$omp/lib/"
          chmod u+w "$omp/lib/libomp.dylib"
          install_name_tool -id @rpath/libomp.dylib "$omp/lib/libomp.dylib"
          codesign --force --sign - "$omp/lib/libomp.dylib"
          echo "OpenMP_ROOT=$omp" >> "$GITHUB_ENV"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "STAGE_DIR=$RUNNER_TEMP/install" >> "$GITHUB_ENV"
          cmake -S src -B build $CMAKE_COMMON_ARGS \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/install" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_INSTALL_RPATH=@loader_path/../lib

      # --- Common ---------------------------------------------------------------

      - name: Build
        run: cmake --build build --parallel

      - name: Copy the OpenMP runtime next to the programs (Windows)
        if: runner.os == 'Windows'
        run: cp "$LLVM_DIR/bin/libomp.dll" build/Windows-AMD64-Release/

      - name: Unit tests
        run: ctest --test-dir build --parallel 4

      - name: Package
        run: |
          # Several install rules use the absolute CMAKE_INSTALL_PREFIX given
          # at configure time, so it is not overridden here.
          # The package is the whole installation (programs, headers,
          # libraries and the CMake package files); the unit tests are not
          # installed.
          cmake --install build
          pkg="dist/$PKG_NAME"
          mkdir -p "$pkg"
          cp -r "$STAGE_DIR"/. "$pkg/"
          cp LICENSE COPYRIGHT.md AUTHORS README.md "$pkg/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # The OpenMP runtime the programs and libraries use.
            cp "$LLVM_DIR/bin/libomp.dll" "$pkg/bin/"
            cp "$LLVM_DIR/lib/libomp.lib" "$pkg/lib/"
            # Every program must load the bundled runtime, not Visual
            # Studio's (libomp140.x86_64.dll, vcomp140.dll).
            for f in "$pkg"/bin/*.exe; do
              omp_dlls="$("$LLVM_DIR/bin/llvm-objdump.exe" -p "$f" \
                | awk '/DLL Name:/ {print $3}' | grep -i 'omp' || true)"
              if [[ -n "$omp_dlls" && "$omp_dlls" != "libomp.dll" ]]; then
                echo "$f does not use the bundled libomp: $omp_dlls"; exit 1
              fi
            done
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            # The OpenMP runtime and its headers (for find_package(OpenMVG)).
            cp "$OpenMP_ROOT/lib/libomp.dylib" "$pkg/lib/"
            cp -R "$OpenMP_ROOT/include/." "$pkg/include/"
            # Every program must load the bundled runtime.
            for f in "$pkg"/bin/*; do
              file "$f" | grep -q Mach-O || continue
              omp_ref="$(otool -L "$f" | grep libomp || true)"
              [[ -z "$omp_ref" ]] && continue
              if [[ "$omp_ref" != *@rpath/libomp.dylib* ]] \
                || ! otool -l "$f" | grep -q '@loader_path/../lib'; then
                echo "$f does not use the bundled libomp:"
                otool -L "$f"; otool -l "$f" | grep -A2 LC_RPATH; exit 1
              fi
            done
          fi

      # Build a project against the package at its new location, to check
      # that the installation is relocatable and complete.
      - name: Downstream build test
        run: |
          pkg="$PWD/dist/$PKG_NAME"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # The package's own libomp must be used, not the build's copy.
            mv "$OpenMP_ROOT" "$OpenMP_ROOT.unused"
            unset OpenMP_ROOT
          fi
          extra=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pkg="$(cygpath -m "$pkg")"
            extra=(-DCMAKE_CXX_COMPILER="$LLVM_DIR/bin/clang++.exe"
                   -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld")
          fi
          cmake -S .github/ci/downstream -B build-downstream -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$pkg" "${extra[@]}"
          cmake --build build-downstream
          PATH="$pkg/bin:$PATH" ./build-downstream/downstream "$RUNNER_TEMP/sfm_data.json"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # The same with MSVC, which links the package's OpenMP runtime.
            cmake -S .github/ci/downstream -B build-downstream-msvc -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$pkg" \
              -DCMAKE_CXX_COMPILER=cl
            cmake --build build-downstream-msvc
            PATH="$pkg/bin:$PATH" ./build-downstream-msvc/downstream "$RUNNER_TEMP/sfm_data_msvc.json"
            # Both must use the package's OpenMP runtime.
            for f in build-downstream/downstream.exe build-downstream-msvc/downstream.exe; do
              omp_dlls="$("$LLVM_DIR/bin/llvm-objdump.exe" -p "$f" \
                | awk '/DLL Name:/ {print $3}' | grep -i 'omp' || true)"
              if [[ "$omp_dlls" != "libomp.dll" ]]; then
                echo "$f does not use the bundled libomp: $omp_dlls"; exit 1
              fi
            done
          fi

      - name: Archive
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd dist && 7z a -tzip "$PKG_NAME.zip" "$PKG_NAME" > /dev/null)
          else
            tar -C dist -czf "dist/$PKG_NAME.tar.gz" "$PKG_NAME"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "openMVG-fast $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
